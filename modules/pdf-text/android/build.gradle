plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pdftext'
version = '0.1.0'

android {
  namespace "expo.modules.pdftext"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  // Apache PDFBox port for Android, used only to read the text layer of PDFs on the device
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
