name: Build APK

on:
    push:
        branches:
            - master
            - improvements
            - diag-a
            - diag-b
        paths-ignore:
            - 'README.md'
            - 'docs/**'
            - '.github/ISSUE_TEMPLATE/*'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 150
        steps:
            - uses: actions/checkout@v4

            - name: Check signing secret
              env:
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
              run: |
                  if [ -z "$KEYSTORE_PASSWORD" ]; then
                    echo "::error::Add the KEYSTORE_PASSWORD secret (Settings > Secrets and variables > Actions) before building."
                    exit 1
                  fi

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v4
              with:
                  # save the Gradle cache from this branch too, so later builds are faster
                  cache-read-only: false

            - name: Install JS dependencies
              run: npm ci

            - name: Type check and unit tests
              run: |
                  npx tsc --noEmit

            - name: Generate Android project
              run: npx expo prebuild --platform android --clean --no-install
              env:
                  NODE_ENV: production

            - name: Give the build more memory
              # R8 (the release optimiser) runs out of the default heap on this app
              run: |
                  sed -i '/^org.gradle.jvmargs=/d' android/gradle.properties
                  # leading newline: the generated file may not end with one
                  printf '\norg.gradle.jvmargs=-Xmx10g -XX:MaxMetaspaceSize=1g\n' >> android/gradle.properties
                  grep jvmargs android/gradle.properties

            - name: Install signing key
              env:
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
              run: |
                  # The generated project signs release builds with android/app/debug.keystore
                  # (alias androiddebugkey, password android). We swap in our own long-lived key
                  # so every build can update the previous one in place.
                  openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
                    -in .github/signing/release.keystore.enc \
                    -out android/app/debug.keystore \
                    -pass env:KEYSTORE_PASSWORD

            - name: Build release APK (arm64)
              working-directory: android
              run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon "-Dorg.gradle.jvmargs=-Xmx10g -XX:MaxMetaspaceSize=1g"

            - name: Collect APK
              id: apk
              run: |
                  VERSION=$(node -p "require('./app.config.js').expo.version")
                  NAME="ChatterUI-Plus-${VERSION}-build${{ github.run_number }}.apk"
                  cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
                  echo "name=$NAME" >> "$GITHUB_OUTPUT"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.apk.outputs.name }}
                  path: ${{ steps.apk.outputs.name }}

            - name: Publish release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: plus-build-${{ github.run_number }}
                  name: ChatterUI Plus ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
                  prerelease: ${{ github.ref != 'refs/heads/master' }}
                  files: ${{ steps.apk.outputs.name }}
                  body: |
                      Built from `${{ github.ref_name }}` at ${{ github.sha }}.
                      Download the APK below on your phone and open it to install or update.
